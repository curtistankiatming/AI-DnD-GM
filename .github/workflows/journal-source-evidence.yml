name: Journal source evidence
on:
  push:
    branches: [work/journal-validation-transfer]
permissions:
  contents: read
jobs:
  verify-source:
    if: github.repository == 'curtistankiatming/AI-DnD-GM' && github.ref == 'refs/heads/work/journal-validation-transfer'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify exact reviewed source; store tree only, never update branches
        env:
          IMPORT_TOKEN: ${{ github.token }}
          AI_NARRATOR: 'off'
        run: python .journal-review/import.py
