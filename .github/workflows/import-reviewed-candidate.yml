name: Import reviewed alpha2 source
on:
  push:
    branches: [work/alpha2-source-transfer]
permissions:
  contents: read
jobs:
  verify-and-store-tree:
    if: github.repository == 'curtistankiatming/AI-DnD-GM' && github.ref == 'refs/heads/work/alpha2-source-transfer'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      AI_NARRATOR: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify exact reviewed source and store unreferenced Git objects only
        env:
          IMPORT_TOKEN: ${{ github.token }}
        run: python .candidate-transfer/import.py
